version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: infocom
      POSTGRES_PASSWORD: infocom
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://infocom:infocom@db:5432/dashboard

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: